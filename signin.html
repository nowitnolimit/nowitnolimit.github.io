<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Warbloc House</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=1.1">
</head>
<body>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo">
                <img src="assets/img/logo-warbloc.png" alt="Logo Warbloc House" class="logo-icon">
                <div class="logo-text">Warbloc <span>House</span></div>
            </a>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="product.html">Product</a></li>
                    <li><a href="location.html">Location</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

            <div class="nav-buttons" id="auth-buttons">
                <a href="signin.html" class="btn btn-secondary">Sign In</a>
                <a href="order.html" class="btn btn-primary">Order Online</a>
            </div>
        </div>
    </header>

    <div class="page-wrapper">
        <div class="container">
            <div class="form-card">
                <h1 class="form-title">Sign <span>In</span></h1>
                
                <div id="signin-alert-success" class="alert alert-success">
                    <i class="fa-solid fa-circle-check"></i>
                    <span id="signin-success-msg">Account created successfully! Please sign in.</span>
                </div>
                
                <div id="signin-alert-error" class="alert alert-error">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <span id="signin-error-msg">Incorrect email or password.</span>
                </div>

                <form id="signin-form">
                    <div class="form-group">
                        <label class="form-label" for="signin-email">Email Address</label>
                        <input type="email" id="signin-email" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="signin-password">Password</label>
                        <input type="password" id="signin-password" class="form-input" required>
                    </div>

                    <div class="form-options">
                        <label class="form-checkbox">
                            <input type="checkbox" id="signin-remember">
                            <span>Remember Me</span>
                        </label>
                        <a href="#" class="form-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-form" id="btn-submit-signin">
                        <span>Sign In</span>
                    </button>
                </form>

                <div class="form-footer">
                    Don't have an account? <a href="signup.html" class="form-link">Sign Up Now</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Warbloc House. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const signupSuccess = urlParams.get('signup_success');
            const alertSuccess = document.getElementById('signin-alert-success');
            const alertError = document.getElementById('signin-alert-error');

            if (signupSuccess === 'true') {
                alertSuccess.style.display = 'flex';
            }

            const form = document.getElementById('signin-form');
            const btnSubmit = document.getElementById('btn-submit-signin');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                alertSuccess.style.display = 'none';
                alertError.style.display = 'none';

                const email = document.getElementById('signin-email').value.trim();
                const password = document.getElementById('signin-password').value.trim();

                if (!email || !password) {
                    return;
                }

                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Signing In...</span>';

                setTimeout(() => {
                    let displayName = email.split('@')[0];
                    displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
                    
                    localStorage.setItem('wb_logged_in', 'true');
                    localStorage.setItem('wb_user_name', displayName);
                    localStorage.setItem('wb_user_email', email);
                    
                    window.location.href = 'dashboard.html';
                }, 1200);
            });
        });
    </script>
</body>
</html>

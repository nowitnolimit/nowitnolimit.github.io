<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Warbloc House</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <div class="contact-container">
        <div class="contact-header">
            <h2>Get In Touch</h2>
            <p>Ada pertanyaan, kolaborasi, atau mau sewa space? Drop pesan lu di bawah atau mampir langsung ke House kami.</p>
        </div>

        <div class="contact-wrapper">
            <div class="contact-info">
                <h3>Warbloc House</h3>
                
                <div class="info-item">
                    <span class="icon">📍</span>
                    <p>JL. Jambu Raya, No. 43, Jajar, Laweyan, Surakarta</p>
                </div>
                <div class="info-item">
                    <span class="icon">📧</span>
                    <p>warbloc55@gmail.com</p>
                </div>
                <div class="info-item">
                    <span class="icon">📱</span>
                    <p>+62 815-1066-0901</p>
                </div>

                <div class="social-medias">
                    <a href="https://instagram.com/warbloc.house" class="social-link instagram">Instagram</a>
                    <a href="https://wa.me/6281510660901" class="social-link whatsapp">WhatsApp</a>
                </div>
            </div>

            <form class="contact-form" action="https://formspree.io/f/mrednlwk" method="POST">
                <div class="input-group">
                    <label for="name">Nama / Kolektif</label>
                    <input type="text" id="name" name="name" placeholder="Masukin nama lu" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukin email lu" required>
                </div>

                <div class="input-group">
                    <label for="message">Pesan Lu</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tulis sesuatu di sini..." required></textarea>
                </div>

                <button type="submit" class="btn-send">Kirim Pesan</button>
            </form>
        </div>

        <div class="contact-footer">
            <a href="index.html">← Kembali ke Beranda</a>
        </div>
    </div>

</body>
</html>
